<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - RLS Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.cart-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
}

.item-info{
    flex:1;
}

.price{
    color:#e53935;
    font-weight:bold;
    font-size:20px;
}

.buttons{
    margin-top:20px;
}

.btn{
    display:inline-block;
    padding:12px 18px;
    border-radius:6px;
    text-decoration:none;
    color:white;
    margin:5px;
}

.checkout{
    background:#28a745;
}

.products{
    background:#0d6efd;
}

footer{
    margin-top:40px;
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<header>
<h1>🛒 Shopping Cart</h1>
</header>

<div class="container">

<div class="cart-item">
