<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking - RLS Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#28a745;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#eef8ee;
    border-radius:6px;
    display:none;
}

footer{
    margin-top:50px;
    text-align:center;
    padding:20px;
    background:#222;
    color:white;
}
</style>
</head>

<body>

<header>
<h1>📦 Order Tracking</h1>
</header>

<div class="container">

<h2>Track Your Order</h2>

<input type="text" id="orderId" placeholder="Enter Order ID">

<button onclick="trackOrder()">Track Order</button>

<div id="result">
<h3>Order Status</h3>
<p><strong>Status:</strong> Processing</p>
<p><strong>Estimated Delivery:</strong> 2-5 Days</p>
</div>

</div>

<footer>
© 2026 RLS Multi Vendor Store
</footer>

<script>
function trackOrder(){
    let id=document.getElementById("orderId").value;

    if(id===""){
        alert("Please enter your Order ID.");
        return;
    }

    document.getElementById("result").style.display="block";
}
</script>

</body>
</html>
