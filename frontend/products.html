<!DOCTYPE html>
<html>
<head>
  <title>RLS Products</title>
</head>
<body>

<h1>🛍️ Our Products</h1>

<!-- CATEGORY BUTTONS -->
<div style="margin:10px;">
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('Beauty')">Beauty</button>
  <button onclick="filterCategory('Health')">Health</button>
</div>

<div id="product-list"></div>

<script>

let allProducts = [];

// LOAD PRODUCTS
fetch('../products/products.json')
.then(res => res.json())
.then(data => {
    allProducts = data;
    showProducts(allProducts);
});

// SHOW PRODUCTS FUNCTION
function showProducts(products){
    let html = "";

    products.forEach(p => {
        html += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
            
            <img src="../${p.image}" style="width:150px; height:150px; object-fit:cover; border-radius:10px;">

            <h2>${p.name}</h2>
            <p>Price: ${p.price} BDT</p>
            <p>${p.description}</p>

            <!-- WhatsApp Order -->
            <a href="https://wa.me/880178196025?text=I%20want%20to%20order%20${p.name}" target="_blank">
                <button>📲 Order on WhatsApp</button>
            </a>

            <!-- Call Button -->
            <a href="tel:01350913620">
                <button>📞 Call Now</button>
            </a>

        </div>
        `;
    });

    document.getElementById('product-list').innerHTML = html;
}

// CATEGORY FILTER
function filterCategory(cat){
    if(cat === 'all'){
        showProducts(allProducts);
    } else {
        let filtered = allProducts.filter(p => p.category === cat);
        showProducts(filtered);
    }
}

</script>

</body>
</html>
