<!DOCTYPE html>
<html>
<head>
  <title>RLS Products</title>

<style>
body{
  font-family: Arial;
  background:#f5f5f5;
}

h1{
  text-align:center;
}

#product-list{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:15px;
  padding:10px;
}

.product-card{
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0px 2px 8px rgba(0,0,0,0.1);
  text-align:center;
}

.product-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

button{
  margin:5px;
  padding:8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover{
  opacity:0.85;
}

.whatsapp{
  background:green;
  color:white;
}

.call{
  background:blue;
  color:white;
}
</style>

</head>

<body>

<h1>🛍️ Our Products</h1>

<div style="text-align:center; margin:10px;">
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('Beauty')">Beauty</button>
  <button onclick="filterCategory('Health')">Health</button>
</div>

<div id="product-list"></div>

<script>

let allProducts = [];

fetch('../products/products.json')
.then(res => res.json())
.then(data => {
    allProducts = data;
    showProducts(allProducts);
});

function showProducts(products){
    let html = "";

    products.forEach(p => {
        html += `
        <div class="product-card">
            
            <img src="../${p.image}" alt="${p.name}">

            <h2>${p.name}</h2>
            <p>💰 Price: ${p.price} BDT</p>
            <p>${p.description}</p>

            <a href="https://wa.me/880178196025?text=I%20want%20to%20order%20${p.name}" target="_blank">
              <button class="whatsapp">📲 Order WhatsApp</button>
            </a>

            <a href="tel:01350913620">
              <button class="call">📞 Call Now</button>
            </a>

        </div>
        `;
    });

    document.getElementById('product-list').innerHTML = html;
}

function filterCategory(cat){
    if(cat === 'all'){
        showProducts(allProducts);
    } else {
        let filtered = allProducts.filter(p => p.category === cat);
        showProducts(filtered);
    }
}

</script>

</body>
</html>
