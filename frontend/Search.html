<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Products</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:40px;
}

input{
width:280px;
padding:12px;
font-size:16px;
}

button{
padding:12px 20px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
}

.result{
margin-top:30px;
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🔍 Search Product</h1>

<input type="text" id="search" placeholder="Type: dress, shirt, bag">

<button onclick="findProduct()">Search</button>

<div class="result" id="result"></div>

<script>
function findProduct(){
var text=document.getElementById("search").value.toLowerCase();

if(text=="dress"){
document.getElementById("result").innerHTML="👗 Dress Available";
}
else if(text=="shirt"){
document.getElementById("result").innerHTML="👕 Shirt Available";
}
else if(text=="bag"){
document.getElementById("result").innerHTML="👜 Bag Available";
}
else{
document.getElementById("result").innerHTML="❌ Product Not Found";
}
}
</script>

</body>
</html>
