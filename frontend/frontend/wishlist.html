<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - RLS Multi Vendor Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#e91e63;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:1000px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
padding:15px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:15px 0 10px;
}

.price{
color:red;
font-size:20px;
font-weight:bold;
}

button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:5px;
cursor:pointer;
background:#e91e63;
color:white;
}

footer{
margin-top:40px;
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>
<h1>❤️ My Wishlist</h1>
</header>

<div class="container">

<div class="card">
<img src="../assets/images/product1.jpg" alt="Product">
<h3>Herbal Face Pack</h3>
<p class="price">৳250</p>
<button>Add to Cart</button>
</div>

</div>

<footer>
© 2026 RLS Multi Vendor Store
</footer>

</body>
  </html>
